name: Daily News Bot

on:
  schedule:
    # Запуск каждые 6 часов (в 06:00, 12:00, 18:00, 00:00 по UTC). 
    # Можешь поменять cron-расписание под себя.
    - cron: '0 */2 * * *'
  workflow_dispatch: # Позволяет запускать бота вручную кнопкой в GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        # Важно: даем права на запись, чтобы сохранить state.json
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run News Bot
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GIGACHAT_CREDENTIALS: ${{ secrets.GIGACHAT_CREDENTIALS }}
        OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
      run: python main.py

    - name: Commit and push state.json
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
        git add state.json
        # Коммитим только если файл изменился
        git diff --staged --quiet || (git commit -m "Update state.json" && git push)
